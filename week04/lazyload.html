<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lazy Loading Images | WDD 131</title>
  <meta name="description" content="Demonstration of native lazy loading images in HTML and CSS.">
  <meta name="author" content="Sofia Vidallet">
  <link rel="stylesheet" href="styles/lazyload.css">
  <script src="scripts/lazyload.js" defer></script>
</head>
<body>
  <main>
    <h1>Lazy Loading Demonstration</h1>
    <img src="https://picsum.photos/400/600?random=1" alt="Placeholder scenic photo 1" loading="lazy" width="400" height="600">
    <img src="https://picsum.photos/400/600?random=2" alt="Placeholder scenic photo 2" loading="lazy" width="400" height="600">
    <img src="https://picsum.photos/400/600?random=3" alt="Placeholder scenic photo 3" loading="lazy" width="400" height="600">
    <img src="https://picsum.photos/400/600?random=4" alt="Placeholder scenic photo 4" loading="lazy" width="400" height="600">
    <img src="https://picsum.photos/400/600?random=5" alt="Placeholder scenic photo 5" loading="lazy" width="400" height="600">
    <img src="https://picsum.photos/400/600?random=6" alt="Placeholder scenic photo 6" loading="lazy" width="400" height="600">
  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> Sofia Vidallet | Argentina</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
